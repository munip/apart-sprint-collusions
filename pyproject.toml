[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusion-lab"
version = "0.1.0"
description = "Trusted monitor for detecting and disrupting collusion (incl. steganographic) in multi-agent LLM systems: FastAPI SWE team + double-auction market."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.100",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2",
    "matplotlib>=3.8",
    "python-dotenv>=1",
    "openai>=1.50",          # OpenAI-compatible client: free tiers, routers, gateways, Ollama
    "anthropic>=0.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
google = ["google-genai>=1.0"]   # only for Inspect's native google/ provider (we use Gemini's OpenAI endpoint)
petri = []                 # install Petri separately: pip install git+https://github.com/safety-research/petri
dev = ["pytest>=8"]

[project.scripts]
clab = "collusion_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collusion_lab" = ["scenarios/swe/specs/*.md", "scenarios/swe/prompts/*.md", "scenarios/market/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
