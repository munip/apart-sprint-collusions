[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusion-lab"
version = "0.1.0"
description = "Trusted monitor for detecting and disrupting collusion (incl. steganographic) in multi-agent LLM systems: FastAPI SWE team + double-auction market."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.100",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2",
    "matplotlib>=3.8",
    "python-dotenv>=1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
local = ["openai>=1.50"]   # Ollama / vLLM speak the OpenAI protocol
petri = []                 # install Petri separately: pip install git+https://github.com/safety-research/petri
dev = ["pytest>=8"]

[project.scripts]
clab = "collusion_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collusion_lab" = ["scenarios/swe/specs/*.md", "scenarios/swe/prompts/*.md", "scenarios/market/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
