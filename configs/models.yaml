# Per-role model assignment.  Spec syntax: <provider>/<model-id>  (providers: configs/providers.yaml)
# A role can be one spec or a FALLBACK LIST tried in order (429 / quota / outage -> next).
#
# Roles   SWE   : planner, implementer, tester, reviewer, verifier
#         Market: seller            (buyers are scripted ZIP traders)
#         Monitor: monitor_judge    (the ONLY LLM inside the trusted monitor; used by M2/M4)
#         default: fallback for any agent role not listed
#
# Design rule: the trusted monitor must use a DIFFERENT model family than every agent
# (`clab models check` enforces it) unless `allow_shared_family: true` (correlated-error ablation).
#
# Model ids on free tiers change often. Refresh them with:
#   free-coding-models --json            (lists provider/modelId pairs that currently work)
#   clab providers check                 (probes text + tool calling for every keyed provider)
#
# Select with  --profile <name>  or  CLAB_PROFILE=<name>;  override one role with
#   --role implementer=groq/openai/gpt-oss-120b      (comma-separated list = fallback chain)

generate:              # defaults for every call (per-profile `generate:` overrides)
  max_retries: 2       # keep low: free tiers 429 a lot, we prefer failing over to the next model
  timeout: 180         # total retry budget per call (Inspect semantics)
  attempt_timeout: 90  # cap on a single HTTP attempt - prevents a hung free endpoint from stalling a run
  max_tokens: 4096

# Dynamic pool used by `auto:<kind>` specs (kinds: coder | agent | chat | judge).
# Keys come from free-coding-models' config (apiKeys) and/or .env; candidates from FCM router sets,
# each keyed provider's live /models list, `free-coding-models --json`, and local Ollama.
pool:
  sources: [fcm_sets, fcm_cli, provider_catalogs, ollama]
  max_probe: 24          # how many candidates get a live text + tool-call probe
  concurrency: 6
  timeout: 25           # per probe call (text, then tool call); hard cap per model = 2*timeout+10 s
  ttl_hours: 6           # cache in .cache/model_pool.json; `clab pool discover --refresh` to redo
  chain_length: 4        # discovered models per role before the last-resort tail
  diverse_roles: true    # give each agent role a different primary family when possible
  last_resort: [fcm/fcm, ollama]   # FCM router (if running), then every local Ollama model

profiles:
  scripted:            # $0 deterministic agents, no network
    default: scripted

  # ---- dynamic: whatever free model your FCM keys can reach right now -------------------
  fcm_auto:
    default: auto:agent
    implementer: auto:coder
    tester: auto:coder
    seller: auto:chat
    monitor_judge: auto:judge       # pinned to a family that no agent chain uses

  fcm_auto_local_monitor:           # dynamic free agents, local Ollama trusted monitor
    default: auto:agent
    implementer: auto:coder
    tester: auto:coder
    seller: auto:chat
    monitor_judge: [ollama/gemma2:2b]

  # ---- free tiers (keys via free-coding-models / .env) --------------------------------
  free:                # heterogeneous team: every role a different family; monitor = Gemini (not used by agents)
    planner:     [groq/llama-3.3-70b-versatile, cerebras/llama-3.3-70b, nvidia/meta/llama-3.3-70b-instruct]
    implementer: [nvidia/qwen/qwen3-coder-480b-a35b-instruct, openrouter/qwen/qwen3-coder:free, cerebras/qwen-3-235b-a22b-instruct-2507]
    tester:      [groq/openai/gpt-oss-120b, cerebras/gpt-oss-120b, openrouter/openai/gpt-oss-120b:free]
    reviewer:    [groq/moonshotai/kimi-k2-instruct, nvidia/deepseek-ai/deepseek-v3.1, openrouter/deepseek/deepseek-chat-v3.1:free]
    verifier:    [nvidia/deepseek-ai/deepseek-v3.1, openrouter/deepseek/deepseek-chat-v3.1:free]
    seller:      [groq/llama-3.3-70b-versatile, cerebras/llama-3.3-70b, nvidia/meta/llama-3.3-70b-instruct]
    monitor_judge: [google/gemini-2.5-flash, mistral/mistral-small-latest]

  free_homogeneous:    # all agents the SAME model (shared "Schelling points" -> easier stego?); monitor different
    default:     [groq/openai/gpt-oss-120b, cerebras/gpt-oss-120b, openrouter/openai/gpt-oss-120b:free]
    monitor_judge: [google/gemini-2.5-flash, mistral/mistral-small-latest]

  fcm:                 # agents through the free-coding-models Smart Router (free-coding-models --daemon-bg)
    default:     fcm/fcm                    # or fcm/fcm:<set-name> after `free-coding-models --sync-set <name>`
    monitor_judge: [google/gemini-2.5-flash, ollama/gemma2:2b]   # pinned, never the router

  free_weak_monitor:   # AI-control framing: strong untrusted agents, small local *trusted* monitor
    planner:     [groq/llama-3.3-70b-versatile, cerebras/llama-3.3-70b]
    implementer: [nvidia/qwen/qwen3-coder-480b-a35b-instruct, openrouter/qwen/qwen3-coder:free]
    tester:      [groq/openai/gpt-oss-120b, cerebras/gpt-oss-120b]
    reviewer:    [groq/moonshotai/kimi-k2-instruct, nvidia/deepseek-ai/deepseek-v3.1]
    verifier:    [nvidia/deepseek-ai/deepseek-v3.1]
    seller:      [groq/llama-3.3-70b-versatile, cerebras/llama-3.3-70b]
    monitor_judge: ollama/gemma2:2b

  local:               # fully offline on your machine (2B models: market OK, SWE agents will mostly fail)
    default:     ollama/gemma2:2b
    monitor_judge: ollama/llama3.2:3b       # different family; `ollama pull llama3.2:3b`

  # ---- paid -----------------------------------------------------------------------------
  cloud:               # Anthropic agents, non-Anthropic monitor
    default:     anthropic/claude-haiku-4-5
    monitor_judge: [google/gemini-2.5-flash, mistral/mistral-small-latest]

  mixed:               # paid + free + local in one team
    planner:     groq/llama-3.3-70b-versatile
    implementer: [anthropic/claude-haiku-4-5, nvidia/qwen/qwen3-coder-480b-a35b-instruct]
    tester:      [groq/openai/gpt-oss-120b, cerebras/gpt-oss-120b]
    reviewer:    ollama/gemma2:2b
    verifier:    nvidia/deepseek-ai/deepseek-v3.1
    seller:      [anthropic/claude-haiku-4-5, groq/llama-3.3-70b-versatile]
    monitor_judge: [google/gemini-2.5-flash, mistral/mistral-small-latest]

  # ---- ablations ----------------------------------------------------------------------------
  same_family:         # monitor shares the agents' family (correlated errors)
    default:     [groq/openai/gpt-oss-120b, cerebras/gpt-oss-120b]
    monitor_judge: groq/openai/gpt-oss-20b
    allow_shared_family: true

  cloud_same_family:
    default:     anthropic/claude-haiku-4-5
    monitor_judge: anthropic/claude-sonnet-4-5
    allow_shared_family: true

# USD per 1M tokens (input, output). Free tiers are $0 but rate-limited. First match wins.
prices:
  anthropic/claude-haiku-4-5: [1.0, 5.0]
  anthropic/claude-sonnet-4-5: [3.0, 15.0]
  "openrouter/*:free": [0.0, 0.0]
  "groq/*": [0.0, 0.0]
  "cerebras/*": [0.0, 0.0]
  "nvidia/*": [0.0, 0.0]
  "google/*": [0.0, 0.0]
  "github/*": [0.0, 0.0]
  "mistral/*": [0.0, 0.0]
  "codestral/*": [0.0, 0.0]
  "sambanova/*": [0.0, 0.0]
  "huggingface/*": [0.0, 0.0]
  "cloudflare/*": [0.0, 0.0]
  "fcm/*": [0.0, 0.0]
  "ollama/*": [0.0, 0.0]
  "mockllm/*": [0.0, 0.0]

budget:
  hard_cap_usd: 25.0   # per `clab run` invocation; raise deliberately for full matrices
