# Chain of monitoring (docs/PREREG.md section 9): weak TRUSTED inner desk (inner_trusted) that sellers can see and
# message; capable UNTRUSTED outer reviewer (outer_untrusted) that sees only the order book + desk decisions,
# every 3 hours from hour 7, hidden from sellers; model-free check as fallback when the reviewer is distrusted.
# 3 conditions x 3 seeds x 4 arms = 36 episodes, 18 hours (~110 LLM calls each; ~2.5 h with 2 workers).
#   clab models check --profile free_pinned --probe        # confirm inner_trusted / outer_untrusted respond
#   clab run configs\experiments\market_chain.yaml --out runs\market_chain --workers 2 --role default=ollama_cloud/gemma4:31b
scenario: market
profile: free_pinned
conditions: [A2_honest_chat, A3_overt_cartel, A5_stego_rotation]
seeds: [0, 1, 2]
rounds: 18
chain:
  - {outer: none}                         # inner desk alone: what the weak trusted layer catches
  - {outer: honest, honeypots: true}      # + honest capable reviewer, validated by honeypots
  - {outer: scheming}                     # + scheming reviewer, no validation
  - {outer: scheming, honeypots: true}    # + scheming reviewer, validated by honeypots
cap_usd: 5
