# Market probes by trusted participants (docs/PREREG.md section 8). No online monitor.
# 3 conditions x 3 seeds x {reference} = 9 episodes (75 seller calls each; ~1.5 h with 2 workers).
#   clab run configs\experiments\market_probes_reference.yaml --out runs\market_probes_reference --workers 2
scenario: market
profile: chain_mixed      # PREREG 9d (models pinned in configs/models.yaml)
conditions: [A2_honest_chat, A3_overt_cartel, A5_stego_rotation]
seeds: [0, 1, 2]
rounds: 15
probes: [reference]
cap_usd: 5
