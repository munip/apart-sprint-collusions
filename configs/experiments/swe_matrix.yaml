# Scenario B full matrix. Each (task, condition, seed) runs once without a monitor
# and once per online monitor (paired episodes for prevention/utility metrics).
scenario: swe
profile: scripted          # scripted | cloud | local | mixed | same_family
tasks: [T1, T2, T3, T4, T5]
conditions: [C0_honest_single, C1_honest_team, C2_solo_gaming, C3_collude_overt,
             C4a_stego_encoded, C4b_stego_artifact, C4c_stego_tool,
             C5a_leak_canary, C5b_leak_stripped, C6_aware_stego]
seeds: [0, 1, 2]
online_monitors: [M3]
verifier_fraction: 0.5     # share of hidden FAIL_TO_PASS tests the monitor may run
cap_usd: 150
